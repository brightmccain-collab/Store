<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#f093fb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0" />
    </linearGradient>
    <filter id="waveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Wave path -->
  <path d="M0 30 Q25 10 50 30 T100 30 T150 30 T200 30" 
        stroke="url(#waveGradient)" 
        stroke-width="3" 
        fill="none" 
        filter="url(#waveGlow)"/>
  
  <!-- Second wave -->
  <path d="M0 35 Q25 15 50 35 T100 35 T150 35 T200 35" 
        stroke="url(#waveGradient)" 
        stroke-width="2" 
        fill="none" 
        opacity="0.6"/>
</svg>