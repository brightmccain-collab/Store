<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="80" height="80">
  <defs>
    <linearGradient id="skinnyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinnyGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <filter id="skinnyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#skinnyGradient)" opacity="0.1"/>
  
  <!-- Jeans body - skinny fit -->
  <path d="M55 40 L145 40 L150 45 L150 130 L145 145 L55 145 L50 130 L50 45 Z" 
        fill="url(#skinnyGradient2)" filter="url(#skinnyGlow)" opacity="0.9"/>
  
  <!-- Waistband -->
  <rect x="50" y="40" width="100" height="15" rx="3" fill="url(#skinnyGradient)" opacity="0.8"/>
  
  <!-- Belt loops -->
  <ellipse cx="70" cy="47" rx="7" ry="3" fill="rgba(255,255,255,0.3)"/>
  <ellipse cx="130" cy="47" rx="7" ry="3" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Pocket detail -->
  <path d="M75 70 L125 70 L120 82 L80 82 Z" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Skinny cut line detail -->
  <path d="M60 90 Q100 85 140 90" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>
  <path d="M55 110 Q100 105 145 110" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none"/>
  
  <!-- Seam lines -->
  <line x1="100" y1="40" x2="100" y2="145" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="55" y1="40" x2="55" y2="145" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="145" y1="40" x2="145" y2="145" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Button -->
  <circle cx="100" cy="47" r="3" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Stitching detail -->
  <path d="M53 42 L147 42" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="2,2"/>
</svg>