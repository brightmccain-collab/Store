<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="80" height="80">
  <defs>
    <linearGradient id="distressedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="distressedGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="distressedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#distressedGradient)" opacity="0.1"/>
  
  <!-- Jeans body - distressed -->
  <path d="M50 40 L150 40 L155 45 L155 130 L150 140 L50 140 L45 130 L45 45 Z" 
        fill="url(#distressedGradient2)" filter="url(#distressedGlow)" opacity="0.9"/>
  
  <!-- Waistband -->
  <rect x="45" y="40" width="110" height="15" rx="3" fill="url(#distressedGradient)" opacity="0.8"/>
  
  <!-- Belt loops -->
  <ellipse cx="70" cy="47" rx="8" ry="4" fill="rgba(255,255,255,0.3)"/>
  <ellipse cx="130" cy="47" rx="8" ry="4" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Pocket detail -->
  <path d="M80 70 L120 70 L115 85 L85 85 Z" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Distressed rip details -->
  <path d="M60 95 L65 98 L62 102 L67 105 L63 110" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>
  <path d="M135 100 L140 103 L137 107 L142 110 L138 115" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>
  <path d="M85 120 L90 123 L87 127 L92 130" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>
  
  <!-- Frayed edges -->
  <path d="M48 130 L50 132 L47 134 L49 136 L46 138 L48 140" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
  <path d="M152 130 L150 132 L153 134 L151 136 L154 138 L152 140" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
  
  <!-- Seam lines -->
  <line x1="100" y1="40" x2="100" y2="140" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="50" y1="40" x2="50" y2="140" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="150" y1="40" x2="150" y2="140" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Button -->
  <circle cx="100" cy="47" r="3" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Stitching detail -->
  <path d="M48 42 L152 42" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="2,2"/>
</svg>